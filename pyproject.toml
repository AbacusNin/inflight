[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inflight"
version = "0.1.0"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["boto3>=1.43", "opentelemetry-sdk>=1.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pybatfish>=2024.0.0"]

[project.scripts]
inflight = "inflight.gate.cli:main"

[tool.setuptools.packages.find]
include = ["inflight*"]

[tool.pytest.ini_options]
pythonpath = ["."]
